name: Sync Skills & Stats

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

# Cegah overlap: kalau run sebelumnya belum selesai dan cron masuk lagi,
# run baru akan queue (bukan cancel) supaya sync tidak terlewat.
concurrency:
  group: sync-catalog
  cancel-in-progress: false

jobs:
  # ── Job 1: fetch metadata + SKILL.md ──────────────────────────────────────
  sync-skills:
    name: Sync Skills Catalog
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch skills metadata & content
        run: npm run fetch:skills

      - name: Check for changes
        id: changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/skills-catalog.json src/data/skills-content.json
          git diff --cached --quiet \
            && echo "changed=false" >> $GITHUB_OUTPUT \
            || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit & push skills data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git commit -m "chore: sync skills catalog & content from upstream"
          git pull --rebase || true
          git push || { git pull --rebase && git push; }

  # ── Job 2: clone repo skill, jalankan harness & eval ─────────────────────
  sync-stats:
    name: Sync Stats (Harness & Eval)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch stats (harness & eval)
        run: npm run fetch:stats

      - name: Check for changes
        id: changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/stats.json
          git diff --cached --quiet \
            && echo "changed=false" >> $GITHUB_OUTPUT \
            || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit & push stats data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git commit -m "chore: sync stats from upstream"
          git pull --rebase || true
          git push || { git pull --rebase && git push; }

  # ── Job 3: notifikasi kalau ada job yang gagal ────────────────────────────
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [sync-skills, sync-stats]
    permissions:
      contents: read
    if: failure()
    steps:
      - name: Report failed jobs
        run: |
          echo "## ❌ Sync gagal" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| sync-skills | ${{ needs.sync-skills.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| sync-stats  | ${{ needs.sync-stats.result }}  |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Cek log di: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
